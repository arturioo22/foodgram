version: '3.8'

services:
  db:
    image: postgres:13
    container_name: foodgram_db
    environment:
      POSTGRES_DB: ${DB_NAME:-foodgram}
      POSTGRES_USER: ${DB_USER:-foodgram_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - foodgram_network
    restart: unless-stopped

  backend:
    image: ${DOCKERHUB_USERNAME}/foodgram_backend:latest
    container_name: foodgram_backend
    environment:
      - DJANGO_SETTINGS_MODULE=foodgram.settings
      - DB_NAME=${DB_NAME:-foodgram}
      - DB_USER=${DB_USER:-foodgram_user}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_HOST=db
      - DB_PORT=5432
      - SECRET_KEY=${SECRET_KEY}
      - DEBUG=${DEBUG:-False}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:-fffoooddgramm.ddns.net,localhost,127.0.0.1,backend}
    volumes:
      - static_volume:/app/collected_static
      - media_volume:/app/media
    depends_on:
      - db
    networks:
      - foodgram_network
    restart: unless-stopped

  frontend:
    image: ${DOCKERHUB_USERNAME}/foodgram_frontend:latest
    container_name: foodgram_frontend
    volumes:
      - static_volume:/app/static
    command: >
      sh -c "if [ -d /app/build ]; then 
               cp -r /app/build/. /app/static/ 2>/dev/null || true;
             fi &&
             cd /app/static &&
             npx -y http-server -p 8000 --cors"
    networks:
      - foodgram_network
    restart: unless-stopped

  gateway:
    image: ${DOCKERHUB_USERNAME}/foodgram_gateway:latest
    container_name: foodgram_gateway
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf
      - static_volume:/static
      - media_volume:/media
    depends_on:
      - backend
      - frontend
    networks:
      - foodgram_network
    restart: unless-stopped

volumes:
  postgres_data:
  static_volume:
  media_volume:

networks:
  foodgram_network:
    driver: bridge
