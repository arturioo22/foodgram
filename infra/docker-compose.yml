version: '3.8'

services:
  db:
    image: postgres:13
    container_name: foodgram_db_dev
    environment:
      POSTGRES_DB: foodgram_dev
      POSTGRES_USER: foodgram_user
      POSTGRES_PASSWORD: dev_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data
    networks:
      - foodgram_network_dev

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: foodgram_backend_dev
    command: >
      sh -c "python manage.py migrate &&
             python manage.py runserver 0.0.0.0:8000"
    volumes:
      - ./backend:/app
      - static_volume_dev:/app/collected_static
      - media_volume_dev:/app/media
    ports:
      - "8000:8000"
    environment:
      - DJANGO_SETTINGS_MODULE=foodgram.settings
      - DB_NAME=foodgram_dev
      - DB_USER=foodgram_user
      - DB_PASSWORD=dev_password
      - DB_HOST=db
      - DB_PORT=5432
      - SECRET_KEY=dev-secret-key-change-in-production
      - DEBUG=True
      - ALLOWED_HOSTS=localhost,127.0.0.1,backend
    depends_on:
      - db
    networks:
      - foodgram_network_dev

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: foodgram_frontend_dev
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - static_volume_dev:/app/static
    ports:
      - "3000:3000"
    environment:
      - REACT_APP_API_URL=http://localhost:8000/api
    depends_on:
      - backend
    networks:
      - foodgram_network_dev

volumes:
  postgres_data_dev:
  static_volume_dev:
  media_volume_dev:

networks:
  foodgram_network_dev:
    driver: bridge
