
version: '3.8' 
 
services: 
  db: 
    image: postgres:13 
    container_name: foodgram_db_prod
    environment: 
      POSTGRES_USER: ${POSTGRES_USER} 
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD} 
      POSTGRES_DB: ${POSTGRES_DB} 
    volumes: 
      - pg_data_prod:/var/lib/postgresql/data 
    networks: 
      - foodgram_network_prod 
    restart: unless-stopped 
 
  backend: 
    image: ${DOCKERHUB_USERNAME}/foodgram_backend:latest 
    container_name: foodgram_backend_prod 
    environment: 
      - DJANGO_SETTINGS_MODULE=foodgram_backend.settings 
    ports: 
      - "9001:9000" 
    volumes: 
      - static_volume_prod:/app/collected_static 
      - media_volume_prod:/app/media
      - ./.env:/app/.env
    depends_on: 
      - db 
    networks: 
      - foodgram_network_prod 
    restart: unless-stopped 
 
  frontend: 
    image: ${DOCKERHUB_USERNAME}/foodgram_frontend:latest 
    container_name: foodgram_frontend_prod 
    volumes: 
      - static_volume_prod:/app/build 
    networks: 
      - foodgram_network_prod 
    restart: unless-stopped 
 
  gateway: 
    image: ${DOCKERHUB_USERNAME}/foodgram_gateway:latest 
    container_name: foodgram_gateway_prod 
    ports: 
      - "9000:80" 
    volumes: 
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf 
      - static_volume_prod:/static 
      - media_volume_prod:/media 
      - ./ssl:/etc/ssl/certs:ro 
    depends_on: 
      - backend 
      - frontend 
    networks: 
      - foodgram_network_prod 
    restart: unless-stopped 
 
volumes: 
  pg_data_prod: 
  static_volume_prod: 
  media_volume_prod: 
 
networks: 
  foodgram_network_prod: 
    driver: bridge