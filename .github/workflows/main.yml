name: Foodgram CI/CD Pipeline

on:
  push:
    branches: [ "main" ]

jobs:
  # Этап 1: Тестирование
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          cd backend
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Run Django tests
        timeout-minutes: 3
        run: |
          cd backend
          python manage.py test --noinput
        env:
          DJANGO_SETTINGS_MODULE: foodgram.settings
          SECRET_KEY: dummy-key-for-tests
          DEBUG: "True"
          DB_ENGINE: django.db.backends.sqlite3
          DB_NAME: :memory:

  # Этап 2: Сборка и отправка в Docker Hub
  build-and-push:
    runs-on: ubuntu-latest
    needs: tests
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
      
      - name: Login to DockerHub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}
      
      - name: Build and push backend
        uses: docker/build-push-action@v4
        with:
          context: ./backend
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/foodgram-backend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/foodgram-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            DJANGO_SETTINGS_MODULE=foodgram.settings
            SECRET_KEY=${{ secrets.SECRET_KEY }}
      
      - name: Check for frontend Dockerfile
        id: check_frontend
        run: |
          if [ -f "./frontend/Dockerfile" ]; then
            echo "frontend_exists=true" >> $GITHUB_OUTPUT
          else
            echo "frontend_exists=false" >> $GITHUB_OUTPUT
          fi
      
      - name: Build and push frontend
        if: steps.check_frontend.outputs.frontend_exists == 'true'
        timeout-minutes: 5
        uses: docker/build-push-action@v4
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/foodgram-frontend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/foodgram-frontend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Этап 3: Деплой на сервер
  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Deploy to server
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USER }}
          key: ${{ secrets.SSH_KEY }}
          passphrase: ${{ secrets.SSH_PASSPHRASE }}
          script_timeout: 10m
          script: |
            # Переходим в рабочую директорию
            cd ~/foodgram
            
            # Создаем необходимые директории
            mkdir -p nginx
            
            # Копируем конфигурационные файлы из репозитория
            echo "📦 Копируем конфигурационные файлы..."
            
            # Проверяем, есть ли файлы в репозитории
            if [ -f "infra/docker-compose.yml" ]; then
              cp infra/docker-compose.yml .
              echo "✅ docker-compose.yml скопирован"
            else
              echo "⚠️  docker-compose.yml не найден в репозитории, создаем базовый"
              cat > docker-compose.yml << 'EOF'
            version: '3.8'
            services:
              db:
                image: postgres:15
                restart: always
                volumes:
                  - postgres_data:/var/lib/postgresql/data
                env_file:
                  - .env
                healthcheck:
                  test: ["CMD-SHELL", "pg_isready -U $${DB_USER}"]
                  interval: 10s
                  timeout: 5s
                  retries: 5
              
              backend:
                image: ${{ secrets.DOCKERHUB_USERNAME }}/foodgram-backend:latest
                restart: always
                depends_on:
                  db:
                    condition: service_healthy
                command: >
                  sh -c "python manage.py migrate --noinput &&
                         python manage.py collectstatic --noinput &&
                         gunicorn foodgram.wsgi:application --bind 0.0.0.0:8000 --workers 3 --access-logfile -"
                volumes:
                  - static_volume:/app/static
                  - media_volume:/app/media
                env_file:
                  - .env
                healthcheck:
                  test: ["CMD", "curl", "-f", "http://localhost:8000/health/"]
                  interval: 30s
                  timeout: 10s
                  retries: 3
              
              nginx:
                image: nginx:1.25-alpine
                restart: always
                ports:
                  - "80:80"
                  - "443:443"
                volumes:
                  - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
                  - static_volume:/app/static
                  - media_volume:/app/media
                depends_on:
                  - backend
            
            volumes:
              postgres_data:
              static_volume:
              media_volume:
            
            networks:
              default:
                name: foodgram_network
            EOF
            fi
            
            # Копируем nginx конфиг
            if [ -f "infra/nginx.conf" ]; then
              cp infra/nginx.conf nginx/default.conf
              echo "✅ nginx.conf скопирован"
            elif [ -f "infra/nginx/default.conf" ]; then
              mkdir -p nginx
              cp infra/nginx/default.conf nginx/default.conf
              echo "✅ nginx/default.conf скопирован"
            else
              echo "⚠️  nginx.conf не найден, создаем базовый"
              cat > nginx/default.conf << 'EOF'
            server {
                listen 80;
                server_name _;
                
                # Статические файлы
                location /static/ {
                    alias /app/static/;
                    expires 1y;
                    add_header Cache-Control "public, immutable";
                }
                
                location /media/ {
                    alias /app/media/;
                    expires 6M;
                    add_header Cache-Control "public";
                }
                
                # Основное приложение
                location / {
                    proxy_pass http://backend:8000;
                    proxy_set_header Host $host;
                    proxy_set_header X-Real-IP $remote_addr;
                    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                    proxy_set_header X-Forwarded-Proto $scheme;
                    proxy_connect_timeout 75s;
                    proxy_read_timeout 300s;
                    
                    # WebSocket support
                    proxy_http_version 1.1;
                    proxy_set_header Upgrade $http_upgrade;
                    proxy_set_header Connection "upgrade";
                }
                
                # Health check endpoint
                location /health/ {
                    proxy_pass http://backend:8000/health/;
                    access_log off;
                }
            }
            EOF
            fi
            
            # Обновляем .env файл с секретами
            echo "🔧 Настраиваем переменные окружения..."
            cat > .env << EOF
            # Database
            POSTGRES_DB=${{ secrets.DB_NAME }}
            POSTGRES_USER=${{ secrets.DB_USER }}
            POSTGRES_PASSWORD=${{ secrets.DB_PASSWORD }}
            DB_ENGINE=django.db.backends.postgresql
            DB_NAME=${{ secrets.DB_NAME }}
            DB_USER=${{ secrets.DB_USER }}
            DB_PASSWORD=${{ secrets.DB_PASSWORD }}
            DB_HOST=db
            DB_PORT=5432
            
            # Django
            SECRET_KEY=${{ secrets.SECRET_KEY }}
            DEBUG=False
            ALLOWED_HOSTS=${{ secrets.ALLOWED_HOSTS }}
            
            # CSRF
            CSRF_TRUSTED_ORIGINS=https://${{ secrets.HOST }},http://${{ secrets.HOST }}
            
            # Optional settings
            # EMAIL_HOST=
            # EMAIL_PORT=
            # EMAIL_HOST_USER=
            # EMAIL_HOST_PASSWORD=
            # EMAIL_USE_TLS=
            EOF
            
            echo "🚀 Запускаем деплой..."
            
            # Останавливаем старые контейнеры (сохраняя volumes)
            docker-compose down --remove-orphans
            
            # Очищаем ненужные образы
            docker image prune -f
            
            # Пуллим новые образы
            docker-compose pull
            
            # Запускаем контейнеры
            docker-compose up -d
            
            # Ждем запуска и проверяем статус
            echo "⏳ Ожидаем запуска сервисов..."
            sleep 15
            
            # Проверяем статус контейнеров
            echo "📊 Статус контейнеров:"
            docker-compose ps
            
            # Проверяем логи последних ошибок
            echo "📝 Проверяем логи (последние 10 строк):"
            docker-compose logs --tail=10 backend
            
            # Проверяем здоровье приложения
            echo "🏥 Проверяем health check..."
            if curl -f http://localhost/health/ > /dev/null 2>&1; then
              echo "✅ Приложение запущено и работает!"
            else
              echo "⚠️  Health check не прошел, проверяем подробнее..."
              docker-compose logs backend --tail=20
            fi
            
            echo "🎉 Деплой завершен успешно!"
