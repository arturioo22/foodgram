name: Foodgram CI/CD

on:
  push:
    branches: [ "main" ]

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          cd backend
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Run Django tests
        run: |
          cd backend
          python manage.py test --noinput
        env:
          DJANGO_SETTINGS_MODULE: foodgram.settings
          SECRET_KEY: dummy-key-for-tests
          DEBUG: "True"

  build-frontend:
    runs-on: ubuntu-latest
    needs: tests
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
      
      - name: Login to DockerHub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}
      
      - name: Build and push frontend
        uses: docker/build-push-action@v4
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/foodgram-frontend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-backend:
    runs-on: ubuntu-latest
    needs: tests
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
      
      - name: Login to DockerHub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}
      
      - name: Build and push backend
        uses: docker/build-push-action@v4
        with:
          context: ./backend
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/foodgram-backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    runs-on: ubuntu-latest
    needs: [build-frontend, build-backend]
    steps:
      - name: Deploy to server
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USER }}
          key: ${{ secrets.SSH_KEY }}
          passphrase: ${{ secrets.PASSPHRASE }}
          script: |
            # ========== 1. ПОДГОТОВКА ==========
            echo "🚀 Начинаем деплой Foodgram..."
            cd ~/foodgram
            
            # ========== 2. СОЗДАЕМ .env ФАЙЛ ==========
            echo "⚙️  Создаем .env файл..."
            cat > .env << 'EOF'
            DB_NAME=foodgram
            DB_USER=foodgram_user
            DB_PASSWORD='afdwMp-85pYexEuTJ27nLfLfxdw'
            DOCKERHUB_USERNAME=arturioo22
            SECRET_KEY='-PpGq7VpK5vgk94e-7yTrL1soZMETDoUedrjnbvvPTkN6UrgAI6ViIIRsisFb1wfc5c'
            ALLOWED_HOSTS='fffoooddgramm.ddns.net,localhost,127.0.0.1'
            DEBUG=False
            EOF
            
            # ========== 3. СОЗДАЕМ DOCKER-COMPOSE.YML ==========
            echo "📄 Создаем docker-compose.yml..."
            cat > docker-compose.yml << 'EOF'
            version: '3.8'
            
            services:
              postgres:
                image: postgres:15-alpine
                environment:
                  POSTGRES_DB: foodgram
                  POSTGRES_USER: foodgram_user
                  POSTGRES_PASSWORD: 'afdwMp-85pYexEuTJ27nLfLfxdw'
                volumes:
                  - postgres_data:/var/lib/postgresql/data
                healthcheck:
                  test: ["CMD-SHELL", "pg_isready -U foodgram_user"]
                  interval: 10s
                  timeout: 5s
                  retries: 5
              
              backend:
                image: arturioo22/foodgram-backend:latest
                environment:
                  DB_HOST: postgres
                  DB_NAME: foodgram
                  DB_USER: foodgram_user
                  DB_PASSWORD: 'afdwMp-85pYexEuTJ27nLfLfxdw'
                  SECRET_KEY: '-PpGq7VpK5vgk94e-7yTrL1soZMETDoUedrjnbvvPTkN6UrgAI6ViIIRsisFb1wfc5c'
                  DEBUG: 'False'
                  ALLOWED_HOSTS: 'fffoooddgramm.ddns.net,localhost,127.0.0.1'
                depends_on:
                  postgres:
                    condition: service_healthy
                volumes:
                  - static_volume:/app/static/
                  - media_volume:/app/media/
                command: >
                  sh -c "python manage.py migrate --no-input &&
                        python manage.py collectstatic --no-input &&
                        gunicorn --bind 0.0.0.0:8000 foodgram.wsgi:application"
              
              nginx:
                image: nginx:alpine
                ports:
                  - "80:80"
                volumes:
                  - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
                  - static_volume:/usr/share/nginx/html/static/
                  - media_volume:/usr/share/nginx/html/media/
                depends_on:
                  - backend
            
            volumes:
              postgres_data:
              static_volume:
              media_volume:
            EOF
            
            # ========== 4. СОЗДАЕМ NGINX КОНФИГ ==========
            echo "🌐 Создаем nginx конфиг..."
            mkdir -p nginx
            cat > nginx/default.conf << 'EOF'
            server {
                listen 80;
                server_name _;
                
                location / {
                    proxy_pass http://backend:8000;
                    proxy_set_header Host $host;
                    proxy_set_header X-Real-IP $remote_addr;
                    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                    proxy_set_header X-Forwarded-Proto $scheme;
                }
                
                location /static/ {
                    alias /usr/share/nginx/html/static/;
                }
                
                location /media/ {
                    alias /usr/share/nginx/html/media/;
                }
            }
            EOF
            
            # ========== 5. ОБНОВЛЕНИЕ ОБРАЗОВ ==========
            echo "📥 Обновляем Docker образы..."
            docker pull arturioo22/foodgram-backend:latest
            
            # ========== 6. ЗАПУСК ==========
            echo "🐳 Запускаем docker-compose..."
            
            # Останавливаем старые контейнеры
            docker-compose down 2>/dev/null || true
            
            # Создаем volumes если их нет
            docker volume create postgres_data 2>/dev/null || true
            docker volume create static_volume 2>/dev/null || true
            docker volume create media_volume 2>/dev/null || true
            
            # Проверяем синтаксис
            echo "🔍 Проверяем docker-compose.yml..."
            if docker-compose config -q; then
              echo "✅ docker-compose.yml валиден"
            else
              echo "❌ Ошибка в docker-compose.yml"
              exit 1
            fi
            
            # Запускаем
            docker-compose up -d
            
            # ========== 7. ПРОВЕРКА ==========
            echo "⏳ Ждём запуска..."
            sleep 30
            
            echo "🔍 Проверяем контейнеры:"
            docker-compose ps
            
            echo "📝 Логи бэкенда:"
            docker-compose logs backend --tail 20
            
            echo "🌐 Проверка доступности..."
            if curl -s -f http://localhost/ > /dev/null 2>&1; then
              echo "✅ Сайт доступен!"
            else
              echo "⚠️  Сайт пока не отвечает, подробные логи:"
              docker-compose logs
            fi
            
            echo ""
            echo "🎉 Деплой завершён!"
