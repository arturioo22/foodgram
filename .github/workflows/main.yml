name: Foodgram CI/CD

on:
  push:
    branches: [ "main" ]

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          cd backend
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Run Django tests
        run: |
          cd backend
          python manage.py test --noinput
        env:
          DJANGO_SETTINGS_MODULE: foodgram.settings
          SECRET_KEY: dummy-key-for-tests
          DEBUG: "True"

  build-frontend:
    runs-on: ubuntu-latest
    needs: tests
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
      
      - name: Login to DockerHub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}
      
      - name: Build and push frontend
        uses: docker/build-push-action@v4
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/foodgram-frontend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-backend:
    runs-on: ubuntu-latest
    needs: tests
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
      
      - name: Login to DockerHub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}
      
      - name: Build and push backend
        uses: docker/build-push-action@v4
        with:
          context: ./backend
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/foodgram-backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    runs-on: ubuntu-latest
    needs: [build-backend, build-frontend]
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Create .env file for production
        run: |
          cat > .env.production << EOF
          DB_NAME=foodgram
          DB_USER=foodgram_user
          DB_PASSWORD=${{ secrets.DB_PASSWORD }}
          DOCKERHUB_USERNAME=${{ secrets.DOCKERHUB_USERNAME }}
          SECRET_KEY=${{ secrets.SECRET_KEY }}
          ALLOWED_HOSTS=fffoooddgramm.ddns.net,localhost,127.0.0.1
          DEBUG=False
          EOF
      
      - name: Deploy to server
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            # ========== 1. ПОДГОТОВКА ==========
            echo "🚀 Начинаем деплой Foodgram..."
            cd ~/foodgram
            
            # ========== 2. СОЗДАЕМ .env ФАЙЛ ==========
            echo "⚙️  Создаем .env файл..."
            cat > .env << EOF
            DB_NAME=foodgram
            DB_USER=foodgram_user
            DB_PASSWORD='afdwMp-85pYexEuTJ27nLfLfxdw'
            DOCKERHUB_USERNAME=${{ secrets.DOCKERHUB_USERNAME }}
            SECRET_KEY='-PpGq7VpK5vgk94e-7yTrL1soZMETDoUedrjnbvvPTkN6UrgAI6ViIIRsisFb1wfc5c'
            ALLOWED_HOSTS=fffoooddgramm.ddns.net,localhost,127.0.0.1
            DEBUG=False
            EOF
            
            # ========== 3. КОПИРОВАНИЕ ФАЙЛОВ ==========
            echo "📁 Копируем конфигурационные файлы..."
            
            # Скачиваем docker-compose.yml
            curl -s -o docker-compose.yml https://raw.githubusercontent.com/${{ github.repository }}/${{ github.sha }}/docker-compose.yml
            
            # Создаем папку для nginx
            mkdir -p nginx
            
            # Скачиваем nginx конфиг
            curl -s -o nginx/nginx.conf https://raw.githubusercontent.com/${{ github.repository }}/${{ github.sha }}/nginx/nginx.conf
            
            # ========== 4. ОБНОВЛЕНИЕ ОБРАЗОВ ==========
            echo "📥 Обновляем Docker образы..."
            docker pull ${{ secrets.DOCKERHUB_USERNAME }}/foodgram-backend:latest
            docker pull ${{ secrets.DOCKERHUB_USERNAME }}/foodgram-frontend:latest
            
            # ========== 5. ЗАПУСК ==========
            echo "🐳 Запускаем docker-compose..."
            
            # Останавливаем старые контейнеры
            docker-compose down 2>/dev/null || true
            
            # Создаем volumes если их нет
            docker volume create postgres_data 2>/dev/null || true
            docker volume create static_volume 2>/dev/null || true
            docker volume create media_volume 2>/dev/null || true
            
            # Запускаем
            docker-compose up -d
            
            # ========== 6. ПРОВЕРКА ==========
            echo "⏳ Ждём запуска..."
            sleep 20
            
            echo "🔍 Проверяем контейнеры:"
            docker-compose ps
            
            echo "🌐 Проверка доступности:"
            
            # Проверяем бэкенд
            echo "➡️  Бэкенд (внутри сети):"
            if docker-compose exec backend curl -s -f http://localhost:8000/api/ > /dev/null 2>&1; then
              echo "✅ Бэкенд работает"
            else
              echo "❌ Бэкенд не отвечает"
              docker-compose logs backend --tail 30
            fi
            
            # Проверяем через nginx
            echo "➡️  Nginx (публичный доступ):"
            if curl -s -f http://localhost/ > /dev/null 2>&1; then
              echo "✅ Сайт доступен через Nginx"
            else
              echo "❌ Nginx не отвечает"
              docker-compose logs nginx --tail 20
            fi
            
            echo ""
            echo "🎉 Деплой завершён!"
            echo "🌐 Сайт: http://${{ secrets.HOST }}/"
            echo "🔧 Админка: http://${{ secrets.HOST }}/admin/"
            echo "📊 API: http://${{ secrets.HOST }}/api/"
