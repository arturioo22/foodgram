name: Foodgram CI/CD

on:
  push:
    branches: [ main ]

jobs:
  tests:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      
      - name: Set up Python
        uses: actions/setup-python@v2
        with:
          python-version: 3.11
      
      - name: Install dependencies
        run: |
          cd backend
          python -m pip install --upgrade pip
          pip install flake8
          pip install -r requirements.txt
      
      - name: Lint with flake8
        run: |
          cd backend
          python -m flake8 . --exclude */migrations/

  build_and_push_to_docker_hub:
    name: Build and push to Docker Hub
    runs-on: ubuntu-latest
    needs: tests
    steps:
      - name: Check out the repo
        uses: actions/checkout@v2
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
      
      - name: Login to Docker
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}
      
      - name: Build and push backend
        uses: docker/build-push-action@v4
        with:
          context: ./backend
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/foodgram-backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: build_and_push_to_docker_hub
    if: success() && github.ref == 'refs/heads/main'
    
    steps:
      - name: Deploy to server
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USER }}
          key: ${{ secrets.SSH_KEY }}
          passphrase: ${{ secrets.PASSPHRASE }}
          timeout: 10m
          script: |
            # 1. Переходим в директорию проекта
            cd ~/foodgram
            
            # 2. Создаем .env файл
            echo "DB_NAME=foodgram" > .env
            echo "DB_USER=foodgram_user" >> .env
            echo "DB_PASSWORD=afdwMp-85pYexEuTJ27nLfLfxdw" >> .env
            echo "SECRET_KEY=-PpGq7VpK5vgk94e-7yTrL1soZMETDoUedrjnbvvPTkN6UrgAI6ViIIRsisFb1wfc5c" >> .env
            echo "DEBUG=False" >> .env
            echo "ALLOWED_HOSTS=fffoooddgramm.ddns.net,localhost,127.0.0.1" >> .env
            
            # 3. Создаем docker-compose.yml
            cat > docker-compose.yml << 'EOF'
            version: '3.8'
            services:
              postgres:
                image: postgres:15-alpine
                environment:
                  POSTGRES_DB: foodgram
                  POSTGRES_USER: foodgram_user
                  POSTGRES_PASSWORD: afdwMp-85pYexEuTJ27nLfLfxdw
                volumes:
                  - postgres_data:/var/lib/postgresql/data
              
              backend:
                image: ${{ secrets.DOCKERHUB_USERNAME }}/foodgram-backend:latest
                environment:
                  DB_HOST: postgres
                  DB_NAME: foodgram
                  DB_USER: foodgram_user
                  DB_PASSWORD: afdwMp-85pYexEuTJ27nLfLfxdw
                  SECRET_KEY: -PpGq7VpK5vgk94e-7yTrL1soZMETDoUedrjnbvvPTkN6UrgAI6ViIIRsisFb1wfc5c
                  DEBUG: 'False'
                  ALLOWED_HOSTS: 'fffoooddgramm.ddns.net,localhost,127.0.0.1'
                depends_on:
                  - postgres
                volumes:
                  - static_volume:/app/static/
                  - media_volume:/app/media/
                command: >
                  sh -c "python manage.py migrate --no-input &&
                         python manage.py collectstatic --no-input &&
                         gunicorn --bind 0.0.0.0:8000 foodgram.wsgi:application"
              
              nginx:
                image: nginx:alpine
                ports:
                  - "80:80"
                volumes:
                  - ./nginx.conf:/etc/nginx/conf.d/default.conf
                  - static_volume:/usr/share/nginx/html/static/
                  - media_volume:/usr/share/nginx/html/media/
                depends_on:
                  - backend
            
            volumes:
              postgres_data:
              static_volume:
              media_volume:
            EOF
            
            # 4. Создаем nginx конфиг
            cat > nginx.conf << 'EOF'
            server {
                listen 80;
                server_name _;
                
                location / {
                    proxy_pass http://backend:8000;
                    proxy_set_header Host $host;
                    proxy_set_header X-Real-IP $remote_addr;
                }
                
                location /static/ {
                    alias /usr/share/nginx/html/static/;
                }
                
                location /media/ {
                    alias /usr/share/nginx/html/media/;
                }
            }
            EOF
            
            # 5. Останавливаем старые контейнеры
            sudo docker-compose down 2>/dev/null || true
            
            # 6. Загружаем новый образ
            sudo docker pull ${{ secrets.DOCKERHUB_USERNAME }}/foodgram-backend:latest
            
            # 7. Запускаем
            sudo docker-compose up -d
            
            # 8. Проверяем
            sleep 15
            echo "✅ Контейнеры запущены:"
            sudo docker-compose ps || echo "docker-compose ps не сработал"
            
            echo "🌐 Проверка сайта:"
            if curl -s -f http://localhost/ > /dev/null 2>&1; then
              echo "✅ Сайт доступен!"
            else
              echo "⚠️  Сайт пока недоступен"
              echo "Логи последних контейнеров:"
              sudo docker-compose logs --tail 10
            fi

  send_message:
    name: Telegram notification
    runs-on: ubuntu-latest
    needs: deploy
    
    steps:
      - name: Send Telegram message
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_TO }}
          token: ${{ secrets.TELEGRAM_TOKEN }}
          message: |
            🚀 Деплой Foodgram завершен!
            📍 Ветка: ${{ github.ref_name }}
            👤 Автор: ${{ github.actor }}
            ✅ Статус: Успешно
            🌐 Сайт: http://${{ secrets.HOST }}/
            ⏰ Время: $(date -u)