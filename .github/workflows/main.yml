name: Foodgram CI/CD Pipeline

on:
  push:
    branches: [ "main" ]

jobs:
  # Этап 1: Тестирование
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          cd backend
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Run Django tests
        timeout-minutes: 3
        run: |
          cd backend
          python manage.py test --noinput
        env:
          DJANGO_SETTINGS_MODULE: foodgram.settings
          SECRET_KEY: dummy-key-for-tests
          DEBUG: "True"

  # Этап 2: Сборка и отправка в Docker Hub
  build-and-push:
    runs-on: ubuntu-latest
    needs: tests
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
      
      - name: Login to DockerHub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}
      
      - name: Build and push backend
        uses: docker/build-push-action@v4
        with:
          context: ./backend
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/foodgram-backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
      
      - name: Check for frontend Dockerfile
        id: check_frontend
        run: |
          if [ -f "./frontend/Dockerfile" ]; then
            echo "frontend_exists=true" >> $GITHUB_OUTPUT
          else
            echo "frontend_exists=false" >> $GITHUB_OUTPUT
          fi
      
      - name: Build and push frontend
        if: steps.check_frontend.outputs.frontend_exists == 'true'
        timeout-minutes: 5
        uses: docker/build-push-action@v4
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/foodgram-frontend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Этап 3: Деплой на сервер
  deploy:
    runs-on: ubuntu-latest  # ← ДОБАВЬТЕ ЭТУ СТРОКУ
    needs: build-and-push   # ← Убедитесь, что это есть
    timeout-minutes: 15     # ← Рекомендую добавить
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Deploy to production server
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USER }}
          key: ${{ secrets.SSH_KEY }}
          passphrase: ${{ secrets.PASSPHRASE }}
          timeout: 4m
          script: |
            # Переходим в рабочую директорию
            cd ~/foodgram
            
            # 1. Копируем файлы
            echo "📁 Копируем файлы..."
            sudo mkdir -p nginx
            
            # docker-compose.yml в корне
            sudo cp -f /github/workspace/docker-compose.yml .
            
            # Используем nginx.conf из папки nginx/ (а не infra/)
            sudo cp -f /github/workspace/nginx/nginx.conf ./nginx/
            
            # 2. Проверяем и создаём БД (упрощённо)
            echo "🗄️  Проверяем базу данных..."
            
            # Простой способ - просто пытаемся создать, если не существует
            docker run --rm --network=host postgres:15-alpine psql -h localhost -U postgres \
              -c "CREATE DATABASE foodgram;" 2>/dev/null || true
              
            docker run --rm --network=host postgres:15-alpine psql -h localhost -U postgres \
              -c "CREATE USER foodgram_user WITH PASSWORD 'afdwMp-85pYexEuTJ27nLfLfxdw';" 2>/dev/null || true
              
            docker run --rm --network=host postgres:15-alpine psql -h localhost -U postgres \
              -c "GRANT ALL PRIVILEGES ON DATABASE foodgram TO foodgram_user;" 2>/dev/null || true
            
            # 3. Запускаем контейнеры
            echo "🐳 Запускаем контейнеры..."
            
            # Сначала останавливаем старые (если есть)
            sudo docker-compose down 2>/dev/null || true
            
            # Запускаем заново
            sudo docker-compose up -d --build
            
            # 4. Ждём и выполняем миграции
            echo "⏳ Ждём запуска бэкенда..."
            sleep 20
            
            echo "🔄 Выполняем миграции..."
            # Несколько попыток
            for i in {1..5}; do
              if sudo docker-compose exec -T backend python manage.py migrate --no-input 2>/dev/null; then
                echo "✅ Миграции выполнены"
                break
              else
                echo "🔄 Попытка $i из 5..."
                sleep 10
              fi
            done
            
            echo "📦 Собираем статику..."
            sudo docker-compose exec -T backend python manage.py collectstatic --no-input
            
            echo "✅ Деплой завершён!"
            echo "🌐 Сайт доступен по адресу: http://${{ secrets.HOST }}/"
            echo "📊 Статус контейнеров:"
            sudo docker-compose ps || echo "docker-compose ps не сработал, проверяем напрямую..."
            sudo docker ps