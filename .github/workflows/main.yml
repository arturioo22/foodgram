name: Foodgram CI/CD Pipeline

on:
  push:
    branches: [ "main" ]

jobs:
  # Этап 1: Тестирование
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          cd backend
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Run Django tests
        timeout-minutes: 3
        run: |
          cd backend
          python manage.py test --noinput
        env:
          DJANGO_SETTINGS_MODULE: foodgram.settings
          SECRET_KEY: dummy-key-for-tests
          DEBUG: "True"

  # Этап 2: Сборка и отправка в Docker Hub
  build-and-push:
    runs-on: ubuntu-latest
    needs: tests
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
      
      - name: Login to DockerHub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}
      
      - name: Build and push backend
        uses: docker/build-push-action@v4
        with:
          context: ./backend
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/foodgram-backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Этап 3: Деплой на сервер
  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push
    timeout-minutes: 8
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Deploy to production server
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USER }}
          key: ${{ secrets.SSH_KEY }}
          passphrase: ${{ secrets.PASSPHRASE }}
          timeout: 7m
          script: |
            # ========== 1. ПОДГОТОВКА ==========
            echo "🚀 Начинаем деплой Foodgram..."
            cd ~/foodgram
            
            # ========== 2. КОПИРОВАНИЕ ФАЙЛОВ ==========
            echo "📁 Копируем файлы..."
            
            # Создаём временную папку со ВСЕМИ файлами
            DEPLOY_DIR="/tmp/foodgram_deploy_$(date +%s)"
            sudo mkdir -p $DEPLOY_DIR
            sudo cp -r /github/workspace/* $DEPLOY_DIR/ 2>/dev/null || true
            
            # Определяем где лежат файлы
            if [ -f "$DEPLOY_DIR/docker-compose.yml" ]; then
              echo "✅ docker-compose.yml найден в корне"
              sudo cp -f $DEPLOY_DIR/docker-compose.yml .
            elif [ -f "$DEPLOY_DIR/infra/docker-compose.yml" ]; then
              echo "✅ docker-compose.yml найден в infra/"
              sudo cp -f $DEPLOY_DIR/infra/docker-compose.yml .
            else
              echo "❌ docker-compose.yml не найден!"
              find $DEPLOY_DIR -name "*.yml" -o -name "*.yaml" | head -10
              exit 1
            fi
            
            # NGINX конфиг
            sudo mkdir -p nginx
            if [ -f "$DEPLOY_DIR/nginx/nginx.conf" ]; then
              echo "✅ nginx.conf найден в nginx/"
              sudo cp -f $DEPLOY_DIR/nginx/nginx.conf ./nginx/
            elif [ -f "$DEPLOY_DIR/nginx/default.conf" ]; then
              echo "✅ default.conf найден в nginx/"
              sudo cp -f $DEPLOY_DIR/nginx/default.conf ./nginx/
            else
              echo "⚠️  Создаём минимальный nginx.conf..."
              sudo cat > ./nginx/default.conf << 'NGINX_EOF'
              server {
                  listen 80;
                  location / {
                      proxy_pass http://backend:8000;
                  }
              }
              NGINX_EOF
            fi
            
            # ========== 3. БАЗА ДАННЫХ ==========
            echo "🗄️  Настраиваем базу данных..."
            
            # Останавливаем всё чтобы получить доступ к порту 5432
            sudo docker-compose down 2>/dev/null || true
            
            # Создаём БД через временный контейнер
            docker run --rm --name init-db \
              -e PGPASSWORD='afdwMp-85pYexEuTJ27nLfLfxdw' \
              postgres:15-alpine \
              psql -h localhost -U postgres -c "
              SELECT 'CREATE DATABASE foodgram' WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = 'foodgram')\gexec
              SELECT 'CREATE USER foodgram_user WITH PASSWORD ''afdwMp-85pYexEuTJ27nLfLfxdw''' WHERE NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'foodgram_user')\gexec
              GRANT ALL PRIVILEGES ON DATABASE foodgram TO foodgram_user;
              " 2>/dev/null || echo "⚠️  БД уже существует"
            
            # ========== 4. ЗАПУСК КОНТЕЙНЕРОВ ==========
            echo "🐳 Запускаем контейнеры..."
            
            # Используем правильный compose файл
            COMPOSE_FILE="docker-compose.yml"
            
            # Запускаем БД отдельно сначала
            sudo docker-compose -f $COMPOSE_FILE up -d postgres
            
            # Ждём готовности БД
            echo "⏳ Ждём готовности PostgreSQL..."
            sleep 10
            
            # Запускаем бэкенд с упрощённой командой
            echo "🚀 Запускаем бэкенд..."
            sudo docker-compose -f $COMPOSE_FILE stop backend 2>/dev/null || true
            sudo docker-compose -f $COMPOSE_FILE rm -f backend 2>/dev/null || true
            
            # Запускаем бэкенд БЕЗ автоматических миграций
            sudo docker run -d \
              --name foodgram_backend \
              --network foodgram_default \
              -e DB_HOST=postgres \
              -e DB_NAME=foodgram \
              -e DB_USER=foodgram_user \
              -e DB_PASSWORD='afdwMp-85pYexEuTJ27nLfLfxdw' \
              -e SECRET_KEY='-PpGq7VpK5vgk94e-7yTrL1soZMETDoUedrjnbvvPTkN6UrgAI6ViIIRsisFb1wfc5c' \
              -e DEBUG=False \
              -e ALLOWED_HOSTS='fffoooddgramm.ddns.net,localhost,127.0.0.1' \
              -v foodgram_static_volume:/app/static \
              -v foodgram_media_volume:/app/media \
              arturioo22/foodgram-backend:latest \
              sh -c "python manage.py collectstatic --no-input && gunicorn --bind 0.0.0.0:8000 foodgram.wsgi:application"
            
            # Запускаем nginx
            sudo docker-compose -f $COMPOSE_FILE up -d nginx
            
            # ========== 5. МИГРАЦИИ (отдельно) ==========
            echo "🔄 Выполняем миграции вручную..."
            
            # Ждём запуска бэкенда
            sleep 15
            
            # Пробуем миграции
            for attempt in {1..3}; do
              echo "Попытка $attempt из 3..."
              if docker exec foodgram_backend python manage.py migrate --no-input 2>&1 | grep -q "OK"; then
                echo "✅ Миграции успешно выполнены"
                break
              else
                echo "⚠️  Миграции не удались, пробуем через 10 сек..."
                sleep 10
              fi
            done
            
            # Если миграции не удались - продолжаем без них
            echo "📦 Собираем статику..."
            docker exec foodgram_backend python manage.py collectstatic --no-input 2>/dev/null || true
            
            # ========== 6. ПРОВЕРКА ==========
            echo "🔍 Проверяем работоспособность..."
            
            # Проверяем контейнеры
            echo "📊 Статус контейнеров:"
            docker ps --format "table {{.Names}}\t{{.Status}}\t{{.Ports}}"
            
            # Проверяем доступность
            echo "🌐 Проверка доступности:"
            if curl -s -f http://localhost:8000/ > /dev/null 2>&1; then
              echo "✅ Бэкенд отвечает на порту 8000"
            else
              echo "⚠️  Бэкенд не отвечает на порту 8000"
            fi
            
            if curl -s -f http://localhost/ > /dev/null 2>&1; then
              echo "✅ Nginx отвечает на порту 80"
            else
              echo "⚠️  Nginx не отвечает на порту 80"
            fi
            
            echo ""
            echo "🎉 Деплой завершён!"
            echo "🌐 Сайт: http://${{ secrets.HOST }}/"
            echo "🔧 Админка: http://${{ secrets.HOST }}/admin/"
            echo "📊 API: http://${{ secrets.HOST }}/api/"
            
            # Логи для отладки
            echo ""
            echo "📋 Логи бэкенда (последние 5 строк):"
            docker logs foodgram_backend --tail 5 2>/dev/null || echo "Не удалось получить логи"