name: Foodgram CI/CD Pipeline

on:
  push:
    branches: [ "main" ]

jobs:
  # Этап 1: Тестирование
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          cd backend
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Run Django tests
        timeout-minutes: 3
        run: |
          cd backend
          python manage.py test --noinput
        env:
          DJANGO_SETTINGS_MODULE: foodgram.settings
          SECRET_KEY: dummy-key-for-tests
          DEBUG: "True"

  # Этап 2: Сборка и отправка в Docker Hub
  build-and-push:
    runs-on: ubuntu-latest
    needs: tests
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
      
      - name: Login to DockerHub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}
      
      - name: Build and push backend
        uses: docker/build-push-action@v4
        with:
          context: ./backend
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/foodgram-backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
      
      - name: Check for frontend Dockerfile
        id: check_frontend
        run: |
          if [ -f "./frontend/Dockerfile" ]; then
            echo "frontend_exists=true" >> $GITHUB_OUTPUT
          else
            echo "frontend_exists=false" >> $GITHUB_OUTPUT
          fi
      
      - name: Build and push frontend
        if: steps.check_frontend.outputs.frontend_exists == 'true'
        timeout-minutes: 5
        uses: docker/build-push-action@v4
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/foodgram-frontend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Этап 3: Деплой на сервер
  deploy:
    runs-on: ubuntu-latest  # <-- ДОБАВЛЕНО ЭТО ПОЛЕ
    needs: build-and-push
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Deploy to server
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USER }}
          key: ${{ secrets.SSH_KEY }}
          passphrase: ${{ secrets.PASSPHRASE }}
          script: |
            cd ~/foodgram
            
            # Создаем директорию nginx если её нет
            mkdir -p nginx
            
            # Копируем файлы из репозитория
            # Используем путь откуда Actions развернул код
            cp -f /home/runner/work/_actions/appleboy/ssh-action@v1.0.0/../${{ github.repository }}/infra/docker-compose.yml . 2>/dev/null || \
              echo "Пытаемся найти docker-compose.yml в другом месте..."
            
            # Альтернативный путь поиска файлов
            find /home/runner/work -name "docker-compose.yml" -o -name "nginx.conf" | head -10
            
            # Если файлы не найдены, создаем базовые
            if [ ! -f "docker-compose.yml" ]; then
              echo "⚠️  docker-compose.yml не найден, создаём базовый"
              cat > docker-compose.yml << 'EOF'
            version: '3.8'
            services:
              db:
                image: postgres:13
                volumes:
                  - postgres_data:/var/lib/postgresql/data
                env_file:
                  - .env
              
              backend:
                image: ${{ secrets.DOCKERHUB_USERNAME }}/foodgram-backend:latest
                depends_on:
                  - db
                command: >
                  sh -c "python manage.py migrate &&
                         python manage.py collectstatic --noinput &&
                         gunicorn foodgram.wsgi:application --bind 0.0.0.0:8000"
                volumes:
                  - static_volume:/app/static
                  - media_volume:/app/media
                env_file:
                  - .env
              
              nginx:
                image: nginx:1.21
                ports:
                  - "80:80"
                volumes:
                  - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
                  - static_volume:/app/static
                depends_on:
                  - backend
            
            volumes:
              postgres_data:
              static_volume:
              media_volume:
            EOF
            fi
            
            if [ ! -f "nginx/default.conf" ]; then
              echo "⚠️  nginx.conf не найден, создаём базовый"
              mkdir -p nginx
              cat > nginx/default.conf << 'EOF'
            server {
                listen 80;
                server_name _;
                
                location /static/ {
                    alias /app/static/;
                }
                
                location /media/ {
                    alias /app/media/;
                }
                
                location / {
                    proxy_pass http://backend:8000;
                    proxy_set_header Host $host;
                    proxy_set_header X-Real-IP $remote_addr;
                    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                    proxy_set_header X-Forwarded-Proto $scheme;
                }
            }
            EOF
            fi
            
            # Обновляем .env файл с секретами
            cat > .env << EOF
            DB_ENGINE=django.db.backends.postgresql
            DB_NAME=${{ secrets.DB_NAME }}
            DB_USER=${{ secrets.DB_USER }}
            DB_PASSWORD=${{ secrets.DB_PASSWORD }}
            DB_HOST=db
            DB_PORT=5432
            SECRET_KEY=${{ secrets.SECRET_KEY }}
            DEBUG=False
            ALLOWED_HOSTS=${{ secrets.HOST }}
            EOF
            
            # Останавливаем старые контейнеры и запускаем новые
            docker-compose down
            docker-compose pull
            docker-compose up -d
            
            # Ждем запуска и проверяем статус
            sleep 10
            echo "✅ Деплой завершен!"
            echo "📊 Статус контейнеров:"
            docker-compose ps
