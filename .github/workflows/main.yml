name: Foodgram CI/CD Pipeline

on:
  push:
    branches: [ "main" ]

jobs:
  # Этап 1: Тестирование
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          cd backend
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Run Django tests
        timeout-minutes: 3
        run: |
          cd backend
          python manage.py test --noinput
        env:
          DJANGO_SETTINGS_MODULE: foodgram.settings
          SECRET_KEY: dummy-key-for-tests
          DEBUG: "True"

  # Этап 2: Сборка и отправка в Docker Hub
  build-and-push:
    runs-on: ubuntu-latest
    needs: tests
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
      
      - name: Login to DockerHub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}
      
      - name: Build and push backend
        uses: docker/build-push-action@v4
        with:
          context: ./backend
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/foodgram-backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Этап 3: Деплой на сервер
  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push
    timeout-minutes: 8
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Deploy to production server
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USER }}
          key: ${{ secrets.SSH_KEY }}
          passphrase: ${{ secrets.PASSPHRASE }}
          timeout: 7m
          script: |
            # ========== 1. ПОДГОТОВКА ==========
            echo "🚀 Начинаем деплой Foodgram..."
            cd ~/foodgram
            
            # ========== 2. КОПИРОВАНИЕ ФАЙЛОВ ==========
            echo "📁 Останавливаем старые контейнеры..."
            sudo docker-compose down 2>/dev/null || true
            
            echo "📥 Загружаем docker-compose.yml с GitHub..."
            # Скачиваем docker-compose.yml напрямую из репозитория
            curl -s -o docker-compose.yml https://raw.githubusercontent.com/${{ github.repository }}/main/docker-compose.yml 2>/dev/null || \
            curl -s -o docker-compose.yml https://raw.githubusercontent.com/${{ github.repository }}/main/infra/docker-compose.yml 2>/dev/null || \
            (echo "❌ Не удалось загрузить docker-compose.yml" && exit 1)
            
            echo "✅ docker-compose.yml загружен"
            
            # Создаем директорию для nginx если её нет
            mkdir -p nginx
            
            # Скачиваем nginx конфиг
            curl -s -o nginx/default.conf https://raw.githubusercontent.com/${{ github.repository }}/main/nginx/default.conf 2>/dev/null || \
            curl -s -o nginx/nginx.conf https://raw.githubusercontent.com/${{ github.repository }}/main/nginx/nginx.conf 2>/dev/null || \
            (echo "⚠️  Создаём минимальный nginx.conf..." && cat > ./nginx/default.conf << 'NGINX_EOF'
            server {
                listen 80;
                server_name _;
                location / {
                    proxy_pass http://backend:8000;
                    proxy_set_header Host $host;
                    proxy_set_header X-Real-IP $remote_addr;
                    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                    proxy_set_header X-Forwarded-Proto $scheme;
                }
                location /static/ {
                    alias /app/static/;
                }
                location /media/ {
                    alias /app/media/;
                }
            }
            NGINX_EOF
            )
            
            # ========== 3. БАЗА ДАННЫХ ==========
            echo "🗄️  Настраиваем базу данных..."
            
            # Проверяем, существует ли сеть
            if [ -z "$(docker network ls | grep foodgram_default)" ]; then
              echo "🌐 Создаем сеть foodgram_default..."
              docker network create foodgram_default
            fi
            
            # Останавливаем всё чтобы получить доступ к порту 5432
            docker stop foodgram_backend 2>/dev/null || true
            docker rm foodgram_backend 2>/dev/null || true
            docker stop postgres 2>/dev/null || true
            docker rm postgres 2>/dev/null || true
            
            # Запускаем PostgreSQL
            echo "🐘 Запускаем PostgreSQL..."
            docker run -d \
              --name postgres \
              --network foodgram_default \
              -e POSTGRES_DB=foodgram \
              -e POSTGRES_USER=foodgram_user \
              -e POSTGRES_PASSWORD='afdwMp-85pYexEuTJ27nLfLfxdw' \
              -p 5432:5432 \
              -v postgres_data:/var/lib/postgresql/data \
              postgres:15-alpine
            
            # Ждём готовности БД
            echo "⏳ Ждём готовности PostgreSQL..."
            sleep 15
            
            # ========== 4. ЗАПУСК БЭКЕНДА ==========
            echo "🚀 Запускаем бэкенд..."
            
            # Удаляем старый контейнер если есть
            docker stop foodgram_backend 2>/dev/null || true
            docker rm foodgram_backend 2>/dev/null || true
            
            # Создаем volumes если их нет
            docker volume create foodgram_static_volume 2>/dev/null || true
            docker volume create foodgram_media_volume 2>/dev/null || true
            
            # Запускаем бэкенд
            docker run -d \
              --name foodgram_backend \
              --network foodgram_default \
              -e DB_HOST=postgres \
              -e DB_NAME=foodgram \
              -e DB_USER=foodgram_user \
              -e DB_PASSWORD='afdwMp-85pYexEuTJ27nLfLfxdw' \
              -e SECRET_KEY='-PpGq7VpK5vgk94e-7yTrL1soZMETDoUedrjnbvvPTkN6UrgAI6ViIIRsisFb1wfc5c' \
              -e DEBUG=False \
              -e ALLOWED_HOSTS='fffoooddgramm.ddns.net,localhost,127.0.0.1' \
              -v foodgram_static_volume:/app/static \
              -v foodgram_media_volume:/app/media \
              arturioo22/foodgram-backend:latest
            
            # ========== 5. ЗАПУСК NGINX ==========
            echo "🌐 Запускаем Nginx..."
            
            docker stop nginx 2>/dev/null || true
            docker rm nginx 2>/dev/null || true
            
            docker run -d \
              --name nginx \
              --network foodgram_default \
              -p 80:80 \
              -p 443:443 \
              -v $(pwd)/nginx/default.conf:/etc/nginx/conf.d/default.conf \
              -v foodgram_static_volume:/app/static \
              -v foodgram_media_volume:/app/media \
              nginx:alpine
            
            # ========== 6. МИГРАЦИИ И СТАТИКА ==========
            echo "🔄 Выполняем миграции..."
            sleep 10
            
            for attempt in {1..5}; do
              echo "Попытка миграции $attempt из 5..."
              if docker exec foodgram_backend python manage.py migrate --no-input; then
                echo "✅ Миграции успешно выполнены"
                break
              else
                echo "⚠️  Миграции не удались, пробуем через 5 сек..."
                sleep 5
              fi
            done
            
            echo "📦 Собираем статику..."
            docker exec foodgram_backend python manage.py collectstatic --no-input
            
            # ========== 7. ПРОВЕРКА ==========
            echo "🔍 Проверяем работоспособность..."
            sleep 5
            
            echo "📊 Статус контейнеров:"
            docker ps --format "table {{.Names}}\t{{.Status}}\t{{.Ports}}"
            
            echo "🌐 Проверка доступности..."
            if curl -s -f http://localhost:8000/api/ > /dev/null 2>&1; then
              echo "✅ Бэкенд отвечает на порту 8000"
            else
              echo "⚠️  Бэкенд не отвечает на порту 8000"
              docker logs foodgram_backend --tail 20
            fi
            
            if curl -s -f http://localhost/ > /dev/null 2>&1; then
              echo "✅ Nginx отвечает на порту 80"
            else
              echo "⚠️  Nginx не отвечает на порту 80"
              docker logs nginx --tail 10
            fi
            
            echo ""
            echo "🎉 Деплой завершён!"