name: Foodgram CI/CD Pipeline

on:
  push:
    branches: [ "main" ]

jobs:
  # Этап 1: Тестирование
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          cd backend
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Run Django tests
        run: |
          cd backend
          python manage.py test --noinput
        env:
          DJANGO_SETTINGS_MODULE: foodgram.settings
          SECRET_KEY: dummy-key-for-tests
          DEBUG: "True"

  # Этап 2: Сборка и отправка в Docker Hub
  build-and-push:
    runs-on: ubuntu-latest
    needs: tests
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
      
      - name: Login to DockerHub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}
      
      - name: Build and push backend
        uses: docker/build-push-action@v4
        with:
          context: ./backend
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/foodgram-backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
      
      - name: Check for frontend Dockerfile
        id: check_frontend
        run: |
          if [ -f "./frontend/Dockerfile" ]; then
            echo "frontend_exists=true" >> $GITHUB_OUTPUT
          else
            echo "frontend_exists=false" >> $GITHUB_OUTPUT
          fi
      
      - name: Build and push frontend
        if: steps.check_frontend.outputs.frontend_exists == 'true'
        uses: docker/build-push-action@v4
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/foodgram-frontend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Этап 3: Деплой на сервер
  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Deploy to production server
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USER }}
          key: ${{ secrets.SSH_KEY }}
          passphrase: ${{ secrets.PASSPHRASE }}
          script: |
            # Переходим в рабочую директорию
            cd ~/foodgram
            
            # 1. Копируем ВСЕ необходимые файлы
            echo "📁 Копируем файлы..."
            sudo mkdir -p nginx
            sudo cp -f /home/${{ secrets.USER }}/foodgram/docker-compose.yml .
            sudo cp -f /home/${{ secrets.USER }}/foodgram/nginx/nginx.conf ./nginx/
            
            # 2. Проверяем и создаём БД (если не существует)
            echo "🗄️  Проверяем базу данных..."
            DB_EXISTS=$(docker run --rm --network=host postgres:15-alpine psql -h localhost -U postgres -tAc "SELECT 1 FROM pg_database WHERE datname='foodgram'" 2>/dev/null || echo "0")
            
            if [ "$DB_EXISTS" != "1" ]; then
              echo "📦 Создаём базу данных..."
              docker run --rm --network=host postgres:15-alpine psql -h localhost -U postgres -c \
                "CREATE DATABASE foodgram; \
                 CREATE USER foodgram_user WITH PASSWORD 'ваш_пароль_из_.env'; \
                 GRANT ALL PRIVILEGES ON DATABASE foodgram TO foodgram_user;" 2>/dev/null || \
                echo "⚠️  Не удалось создать БД (возможно уже существует)"
            fi
            
            # 3. Обновляем контейнеры
            echo "🐳 Обновляем контейнеры..."
            sudo docker-compose pull 2>/dev/null || true
            sudo docker-compose down 2>/dev/null || true
            sudo docker-compose up -d
            
            # 4. Ждём запуска бэкенда
            echo "⏳ Ждём запуска бэкенда..."
            sleep 15
            
            # 5. Выполняем миграции и сбор статики
            echo "🔄 Выполняем миграции..."
            sudo docker-compose exec -T backend python manage.py migrate --no-input || \
              echo "⚠️  Миграции не выполнены (возможно контейнер ещё не готов)"
            
            echo "📦 Собираем статику..."
            sudo docker-compose exec -T backend python manage.py collectstatic --no-input || \
              echo "⚠️  Статика не собрана"
            
            # 6. Проверяем статус
            echo "✅ Деплой завершён!"
            echo "🌐 Сайт: http://${{ secrets.HOST }}/"
            sudo docker-compose ps