name: Foodgram CI/CD

on:
  push:
    branches: ['**']

jobs:
  tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:13
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          cd backend
          pip install --upgrade pip setuptools
          pip install flake8==6.0.0
          pip install -r requirements.txt

      - name: Run flake8 and tests
        env:
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
          DEBUG: 0
          POSTGRES_DB: postgres
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          ALLOWED_HOSTS: localhost,127.0.0.1
        run: |
          cd backend
          python -m flake8 .
          python manage.py test

  build_and_push_backend:
    runs-on: ubuntu-latest
    needs: tests
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/foodgram_backend:latest

  build_and_push_frontend:
    runs-on: ubuntu-latest
    needs: tests
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/foodgram_frontend:latest

  build_and_push_gateway:
    runs-on: ubuntu-latest
    needs: tests
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push gateway
        uses: docker/build-push-action@v5
        with:
          context: ./nginx
          file: ./nginx/Dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/foodgram_gateway:latest

  deploy:
    runs-on: ubuntu-latest
    needs: 
      - build_and_push_backend
      - build_and_push_frontend
      - build_and_push_gateway
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Copy files to server
        uses: appleboy/scp-action@v0.1.4
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USER }}
          key: ${{ secrets.SSH_KEY }}
          passphrase: ${{ secrets.PASSPHRASE }}
          source: "docker-compose.yml,docker-compose.production.yml,nginx/nginx.conf,nginx/Dockerfile,.env,.env.production,data/"
          target: "foodgram/"

      - name: Deploy to server
        uses: appleboy/ssh-action@v0.1.6
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USER }}
          key: ${{ secrets.SSH_KEY }}
          passphrase: ${{ secrets.PASSPHRASE }}
          script: |
            cd ~/foodgram
            echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin
            export DOCKERHUB_USERNAME="${{ secrets.DOCKERHUB_USERNAME }}"
            
            docker-compose -f docker-compose.production.yml pull
            docker-compose -f docker-compose.production.yml down
            docker-compose -f docker-compose.production.yml up -d

            sleep 15

            docker-compose -f docker-compose.production.yml exec -T backend python manage.py migrate --noinput

            echo "Загрузка фикстур..."

            docker cp ~/foodgram/data/. foodgram_backend_prod:/app/data/

            echo "Проверка ингредиентов..."
            ING_COUNT=$(docker-compose -f docker-compose.production.yml exec -T db psql -U foodgram_user -d foodgram -t -c "SELECT COUNT(*) FROM recipes_ingredient;" | tr -d ' ' || echo "0")
            
            if [ "$ING_COUNT" = "0" ] || [ "$ING_COUNT" -lt "1000" ]; then
              echo "Загрузка ингредиентов в базу..."
              
              docker-compose -f docker-compose.production.yml exec -T backend python -c "import json; import os; \
                with open('/app/data/ingredients.json', 'r', encoding='utf-8') as f: ingredients = json.load(f); \
                fixture = []; \
                [fixture.append({'model': 'recipes.ingredient', 'fields': {'name': ing['name'], 'measurement_unit': ing['measurement_unit']}}) for ing in ingredients]; \
                with open('/app/data/ingredients_fixture.json', 'w', encoding='utf-8') as f: json.dump(fixture, f, ensure_ascii=False, indent=2); \
                print(f'Конвертировано {len(fixture)} ингредиентов')"
              
              docker-compose -f docker-compose.production.yml exec -T backend python manage.py loaddata /app/data/ingredients_fixture.json
            else
              echo "Ингредиенты уже загружены ($ING_COUNT шт.)"
            fi

            echo "Проверка тегов..."
            TAG_COUNT=$(docker-compose -f docker-compose.production.yml exec -T db psql -U foodgram_user -d foodgram -t -c "SELECT COUNT(*) FROM recipes_tag;" | tr -d ' ' || echo "0")
            
            if [ "$TAG_COUNT" = "0" ]; then
              echo "Создание тегов..."
              docker-compose -f docker-compose.production.yml exec -T backend python manage.py shell -c "from recipes.models import Tag; \
                tags = [ \
                  {'name': 'Завтрак', 'color': '#E26C2D', 'slug': 'breakfast'}, \
                  {'name': 'Обед', 'color': '#49B64E', 'slug': 'lunch'}, \
                  {'name': 'Ужин', 'color': '#8775D2', 'slug': 'dinner'}, \
                  {'name': 'Десерт', 'color': '#FFD700', 'slug': 'dessert'}, \
                  {'name': 'Выпечка', 'color': '#FF6347', 'slug': 'baking'}, \
                  {'name': 'Салат', 'color': '#32CD32', 'slug': 'salad'}, \
                  {'name': 'Супы', 'color': '#1E90FF', 'slug': 'soup'}, \
                  {'name': 'Напитки', 'color': '#9370DB', 'slug': 'drinks'}, \
                ]; \
                [Tag.objects.get_or_create(**tag) for tag in tags]; \
                print(f'Создано {Tag.objects.count()} тегов')"
            else
              echo "Теги уже загружены ($TAG_COUNT шт.)"
            fi

            echo "Проверка суперпользователя..."
            SUPERUSER_EXISTS=$(docker-compose -f docker-compose.production.yml exec -T db psql -U foodgram_user -d foodgram -t -c "SELECT COUNT(*) FROM users_user WHERE is_superuser = true;" | tr -d ' ' || echo "0")
            
            if [ "$SUPERUSER_EXISTS" = "0" ]; then
              echo "Создание суперпользователя..."
              docker-compose -f docker-compose.production.yml exec -T backend python manage.py shell -c "from django.contrib.auth import get_user_model; \
                User = get_user_model(); \
                if not User.objects.filter(is_superuser=True).exists(): \
                  User.objects.create_superuser(email='admin@example.com', username='admin', password='admin123', first_name='Admin', last_name='User'); \
                  print('Суперпользователь создан'); \
                else: \
                  print('Суперпользователь уже существует')"
            else
              echo "Суперпользователь уже существует"
            fi

            docker-compose -f docker-compose.production.yml exec -T backend python manage.py collectstatic --noinput

            docker system prune -af
            docker logout

            echo "Деплой завершен успешно!"
            echo "Итоги:"
            echo "- Ингредиентов: $(docker-compose -f docker-compose.production.yml exec -T db psql -U foodgram_user -d foodgram -t -c 'SELECT COUNT(*) FROM recipes_ingredient;' | tr -d ' ')"
            echo "- Тегов: $(docker-compose -f docker-compose.production.yml exec -T db psql -U foodgram_user -d foodgram -t -c 'SELECT COUNT(*) FROM recipes_tag;' | tr -d ' ')"